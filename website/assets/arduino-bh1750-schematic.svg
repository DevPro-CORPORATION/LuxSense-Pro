<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%">
  <defs>
    <linearGradient id="boardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16222F"/>
      <stop offset="100%" stop-color="#0E161F"/>
    </linearGradient>
    <linearGradient id="sensorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2A24"/>
      <stop offset="100%" stop-color="#131C17"/>
    </linearGradient>
    <filter id="wireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#21D789" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="760" height="380" rx="12" fill="#111317" stroke="#232730" stroke-width="1.5"/>

  <!-- Grid lines -->
  <g stroke="#1A1E26" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="380"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="200" y1="0" x2="200" y2="380"/>
    <line x1="280" y1="0" x2="280" y2="380"/>
    <line x1="360" y1="0" x2="360" y2="380"/>
    <line x1="440" y1="0" x2="440" y2="380"/>
    <line x1="520" y1="0" x2="520" y2="380"/>
    <line x1="600" y1="0" x2="600" y2="380"/>
    <line x1="680" y1="0" x2="680" y2="380"/>
    <line x1="0" y1="60" x2="760" y2="60"/>
    <line x1="0" y1="140" x2="760" y2="140"/>
    <line x1="0" y1="220" x2="760" y2="220"/>
    <line x1="0" y1="300" x2="760" y2="300"/>
  </g>

  <!-- ARDUINO UNO R3 BOX -->
  <g transform="translate(60, 50)">
    <rect width="250" height="280" rx="10" fill="url(#boardBg)" stroke="#2B4660" stroke-width="2"/>
    <text x="25" y="40" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#E2E4E9">ARDUINO UNO R3</text>
    <text x="25" y="60" font-family="'Segoe UI', sans-serif" font-size="11" fill="#78909C">ATmega328P Microcontroller</text>

    <!-- IC Chip -->
    <rect x="50" y="90" width="150" height="60" rx="4" fill="#0A0E13" stroke="#37474F" stroke-width="1.5"/>
    <text x="75" y="125" font-family="'Consolas', monospace" font-size="12" fill="#90A4AE">ATMEGA328P-PU</text>

    <!-- Pin Headers Right -->
    <!-- 5V -->
    <circle cx="230" cy="180" r="5" fill="#E06C75"/>
    <text x="195" y="184" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#E06C75">5V</text>

    <!-- GND -->
    <circle cx="230" cy="210" r="5" fill="#8D929B"/>
    <text x="190" y="214" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#8D929B">GND</text>

    <!-- A4 (SDA) -->
    <circle cx="230" cy="240" r="5" fill="#61AFEF"/>
    <text x="160" y="244" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#61AFEF">A4 (SDA)</text>

    <!-- A5 (SCL) -->
    <circle cx="230" cy="270" r="5" fill="#E5C07B"/>
    <text x="160" y="274" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#E5C07B">A5 (SCL)</text>

    <!-- USB Port Left -->
    <rect x="-15" y="170" width="25" height="50" rx="3" fill="#37474F" stroke="#546E7A"/>
    <text x="18" y="200" font-family="'Consolas', monospace" font-size="10" fill="#B0BEC5">USB SERIAL</text>
  </g>

  <!-- WIRING BUS -->
  <!-- 5V Wire (Red) -->
  <path d="M 290 230 C 370 230, 390 140, 480 140" fill="none" stroke="#E06C75" stroke-width="2.5" stroke-linecap="round"/>
  <!-- GND Wire (Grey) -->
  <path d="M 290 260 C 370 260, 390 180, 480 180" fill="none" stroke="#6C7280" stroke-width="2.5" stroke-linecap="round"/>
  <!-- SDA Wire (Blue) -->
  <path d="M 290 290 C 370 290, 390 220, 480 220" fill="none" stroke="#61AFEF" stroke-width="2.5" stroke-linecap="round" filter="url(#wireGlow)"/>
  <!-- SCL Wire (Yellow) -->
  <path d="M 290 320 C 370 320, 390 260, 480 260" fill="none" stroke="#E5C07B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- ADDR to GND (Ground jumper) -->
  <path d="M 570 300 C 585 300, 595 240, 570 180" fill="none" stroke="#6C7280" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- BH1750 SENSOR MODULE BOX -->
  <g transform="translate(480, 70)">
    <rect width="210" height="250" rx="8" fill="url(#sensorBg)" stroke="#22543D" stroke-width="2"/>
    <text x="25" y="38" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#E2E4E9">BH1750 / GY-30</text>
    <text x="25" y="55" font-family="'Segoe UI', sans-serif" font-size="11" fill="#21D789">I2C Ambient Light Sensor</text>

    <!-- Photodiode Lens Window -->
    <rect x="65" y="70" width="80" height="70" rx="6" fill="#0C1510" stroke="#28E895" stroke-width="1.5"/>
    <circle cx="105" cy="105" r="18" fill="#149A5F" opacity="0.4"/>
    <circle cx="105" cy="105" r="10" fill="#21D789"/>
    <circle cx="105" cy="105" r="4" fill="#FFFFFF"/>

    <!-- Sensor Pin Terminals -->
    <!-- VCC -->
    <circle cx="0" cy="70" r="5" fill="#E06C75"/>
    <text x="14" y="74" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#E06C75">VCC (3.3-5V)</text>

    <!-- GND -->
    <circle cx="0" cy="110" r="5" fill="#8D929B"/>
    <text x="14" y="114" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#8D929B">GND</text>

    <!-- SDA -->
    <circle cx="0" cy="150" r="5" fill="#61AFEF"/>
    <text x="14" y="154" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#61AFEF">SDA</text>

    <!-- SCL -->
    <circle cx="0" cy="190" r="5" fill="#E5C07B"/>
    <text x="14" y="194" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#E5C07B">SCL</text>

    <!-- ADDR -->
    <circle cx="0" cy="230" r="5" fill="#98C379"/>
    <text x="14" y="234" font-family="'Consolas', monospace" font-size="11" font-weight="600" fill="#98C379">ADDR (0x23)</text>
  </g>
</svg>
