<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0E1013"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28E895"/>
      <stop offset="100%" stop-color="#149A5F"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#21D789" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#21D789" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#21D789" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#bg)" stroke="#2B303A" stroke-width="2"/>
  <circle cx="60" cy="60" r="42" fill="url(#glow)"/>
  
  <!-- Optical Aperture Rings -->
  <circle cx="60" cy="60" r="32" fill="none" stroke="#252A33" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="60" cy="60" r="22" fill="#14171C" stroke="url(#emerald)" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Photodiode Sensor Core -->
  <circle cx="60" cy="60" r="10" fill="url(#emerald)"/>
  <circle cx="60" cy="60" r="4" fill="#FFFFFF"/>
  
  <!-- Optical Crosshairs -->
  <line x1="60" y1="18" x2="60" y2="28" stroke="#21D789" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="92" x2="60" y2="102" stroke="#21D789" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="60" x2="28" y2="60" stroke="#21D789" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="92" y1="60" x2="102" y2="60" stroke="#21D789" stroke-width="2.5" stroke-linecap="round"/>
</svg>
