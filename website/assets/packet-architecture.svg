<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192026"/>
      <stop offset="100%" stop-color="#101418"/>
    </linearGradient>
  </defs>

  <rect width="760" height="220" rx="10" fill="#111317" stroke="#252A33" stroke-width="1.5"/>

  <text x="30" y="36" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#E2E4E9">SERIAL TELEMETRY PACKET STRUCTURE (128-BIT ROLLING XOR)</text>
  <text x="30" y="54" font-family="'Segoe UI', sans-serif" font-size="11" fill="#78909C">Raw ASCII payload format: [packet_id]|[lux_value]|[checksum] encrypted byte-wise via SECRET_KEY[(i + packet_id) % 16]</text>

  <!-- Flow Boxes -->
  <!-- Box 1: Packet ID -->
  <g transform="translate(30, 80)">
    <rect width="180" height="90" rx="6" fill="#161F28" stroke="#2F4C6E" stroke-width="1.5"/>
    <text x="18" y="32" font-family="'Consolas', monospace" font-size="13" font-weight="700" fill="#61AFEF">uint16_t packet_id</text>
    <text x="18" y="54" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8D929B">Monotonic sequence</text>
    <text x="18" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8D929B">Controls key phase offset</text>
  </g>

  <!-- Pipe delimiter -->
  <text x="225" y="130" font-family="'Consolas', monospace" font-size="24" fill="#3D4452">|</text>

  <!-- Box 2: Lux Reading -->
  <g transform="translate(250, 80)">
    <rect width="240" height="90" rx="6" fill="#14241C" stroke="#21784E" stroke-width="1.5"/>
    <text x="18" y="32" font-family="'Consolas', monospace" font-size="13" font-weight="700" fill="#21D789">float lux (2 dec)</text>
    <text x="18" y="54" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8D929B">Continuous High-Res Mode</text>
    <text x="18" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8D929B">Range: 0.00 – 65,535.00 lx</text>
  </g>

  <!-- Pipe delimiter -->
  <text x="505" y="130" font-family="'Consolas', monospace" font-size="24" fill="#3D4452">|</text>

  <!-- Box 3: Checksum -->
  <g transform="translate(530, 80)">
    <rect width="200" height="90" rx="6" fill="#261E16" stroke="#7A5222" stroke-width="1.5"/>
    <text x="18" y="32" font-family="'Consolas', monospace" font-size="13" font-weight="700" fill="#E5C07B">uint8_t checksum</text>
    <text x="18" y="54" font-family="'Consolas', monospace" font-size="11" fill="#C5CBD5">(packet + lux*100) % 256</text>
    <text x="18" y="70" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8D929B">Deterministic integrity</text>
  </g>
</svg>
