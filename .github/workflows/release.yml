name: LuxSense Pro — Production & Beta Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: "release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  verify-and-test:
    name: Run Automated Tests & Firmware Compilation Verification
    runs-on: windows-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Execute Tests (Strict Verification Gate)
        run: |
          pytest tests/ -v --tb=short

      - name: Verify Arduino Firmware Compilation
        run: |
          python -c "code = open('firmware/LuxSense_Arduino/LuxSense_Arduino.ino').read(); assert 'ID:GY30_LUX_PRO_2026' in code; assert 'sendEncryptedPacket' in code; assert 'SECRET_KEY' in code; print('Firmware syntax and encryption keys verified.')"

  build-and-publish:
    name: Build Binaries, Windows Installer & Publish GitHub Release
    needs: verify-and-test
    runs-on: windows-latest
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Extract Release Version & Determine Channel
        id: release_meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$TAG" == *"beta"* ]] || [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"rc"* ]]; then
            echo "CHANNEL=Beta" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "CHANNEL=Stable" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Application, Bootstrapper & Windows Installer
        shell: pwsh
        run: |
          python installer/build_installer.py

      - name: Generate Changelog from Git Commits
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" -n 15)
          else
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LuxSense Pro ${{ github.ref_name }} [${{ steps.release_meta.outputs.CHANNEL }}]
          tag_name: ${{ github.ref_name }}
          body: |
            ## LuxSense Pro ${{ github.ref_name }} — ${{ steps.release_meta.outputs.CHANNEL }} Channel
            
            Enterprise-grade optical radiometry and ambient illuminance monitoring workstation.
            
            ### Release Information
            - **Channel:** ${{ steps.release_meta.outputs.CHANNEL }}
            - **Version:** ${{ steps.release_meta.outputs.VERSION }}
            - **Published By:** DevPro-CORP
            
            ### What's New
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ### Verified SHA-256 Checksums
            ```
            $(cat dist_installer/SHA256SUMS.txt)
            ```
            
            ### Distribution Assets
            - **Windows Setup Wizard:** `LuxSense-Pro-Setup-${{ github.ref_name }}.exe`
            - **Portable Distribution:** `LuxSense-Pro-${{ github.ref_name }}-portable.zip`
            - **Standalone Updater:** `updater.exe`
            - **Release Manifest:** `release-manifest.json`
            - **Checksums:** `SHA256SUMS.txt`
          draft: false
          prerelease: ${{ steps.release_meta.outputs.IS_PRERELEASE == 'true' }}
          files: |
            dist_installer/LuxSense-Pro-Setup-*.exe
            dist_installer/LuxSense-Pro-*-portable.zip
            dist/updater.exe
            dist_installer/SHA256SUMS.txt
            dist_installer/release-manifest.json
