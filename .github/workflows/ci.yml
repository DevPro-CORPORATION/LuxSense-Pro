name: LuxSense Pro — Continuous Integration

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Automated Test Suite & Metrology Verification
    runs-on: windows-latest
    env:
      PYTHONPATH: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Verify Firmware Sketch Integrity
        run: |
          python -c "p = 'firmware/LuxSense_Arduino/LuxSense_Arduino.ino'; code = open(p).read(); assert 'ID:GY30_LUX_PRO_2026' in code; assert 'sendEncryptedPacket' in code; print('Firmware integrity verified.')"

      - name: Verify Cryptographic Hash Functions
        run: |
          python -c "import updater.security as s, tempfile, pathlib; p = pathlib.Path(tempfile.mktemp()); p.write_bytes(b'CI_VERIFY'); assert len(s.compute_sha256(p)) == 64; p.unlink()"
